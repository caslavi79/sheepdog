<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheepdog Staffing — The Roster · v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@800;900&family=JetBrains+Mono:wght@600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;color:#ddd}
.controls{display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:13px;flex-wrap:wrap;justify-content:center}
.controls label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#ccc}
.controls button{padding:8px 18px;background:#444;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.tc{font-size:12px;color:#999;font-family:monospace;min-width:50px;text-align:right}
.legal{margin-top:18px;font-family:'Source Sans 3',system-ui,sans-serif;font-size:12px;color:#A0A0A0}
.legal a{color:#C9922E}

.reel-frame{width:360px;height:640px;background:#0A0A0A;border-radius:14px;position:relative;overflow:hidden;font-family:'Source Sans 3',system-ui,sans-serif;color:#FAF6EE;box-shadow:0 30px 80px rgba(0,0,0,0.5);isolation:isolate}

/* Ambient amber glow, faint */
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%, rgba(201,146,46,0.14) 0%, rgba(201,146,46,0.04) 30%, transparent 60%);pointer-events:none;z-index:1}

/* IG safe-zone overlay */
.dz{position:absolute;inset:0;pointer-events:none;z-index:50;display:none}
.dz-on .dz{display:block}
.dz-t{position:absolute;top:0;left:0;right:0;height:93px;background:rgba(226,75,74,0.12);border-bottom:1px dashed rgba(226,75,74,0.45)}
.dz-b{position:absolute;bottom:0;left:0;right:0;height:150px;background:rgba(226,75,74,0.12);border-top:1px dashed rgba(226,75,74,0.45)}
.dz-r{position:absolute;top:93px;bottom:150px;right:0;width:73px;background:rgba(226,75,74,0.12);border-left:1px dashed rgba(226,75,74,0.45)}

.body-wrap{position:absolute;inset:0;overflow:hidden;z-index:10}
.scene{position:absolute;inset:0;will-change:transform}
.s1{animation:slideOutLeft 0.45s cubic-bezier(.16,1,.3,1) 5.6s forwards}
.s2{transform:translateX(100%);animation:slideInRight 0.45s cubic-bezier(.16,1,.3,1) 5.6s forwards}

/* Dog mark */
.logo{position:absolute;top:108px;left:50%;transform:translateX(-50%);width:42px;height:35px;z-index:15}
.logo svg{width:42px;height:35px;display:block}

/* ───────────── SCENE 1: ROSTER GRID ───────────── */
.s1-eyebrow{position:absolute;top:152px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:3px;color:#C9922E;text-transform:uppercase;opacity:0;animation:fadeIn 0.35s ease 0.2s forwards}

.s1-title{position:absolute;top:180px;left:0;right:0;text-align:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;font-size:28px;letter-spacing:-0.5px;color:#FAF6EE;text-transform:uppercase;opacity:0;animation:fadeUp 0.45s cubic-bezier(.16,1,.3,1) 0.5s forwards}

/* Grid container */
.roster{position:absolute;top:232px;left:30px;right:30px;z-index:10}
.roster-days{display:grid;grid-template-columns:42px repeat(7,1fr);gap:3px;margin-bottom:4px}
.roster-days .d{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;color:#7A8490;text-align:center;padding:4px 0;opacity:0;transform:translateY(-6px);animation:fadeDown 0.3s ease forwards}
.roster-days .d:nth-child(1){animation-delay:0.75s}
.roster-days .d:nth-child(2){animation-delay:0.82s}
.roster-days .d:nth-child(3){animation-delay:0.88s}
.roster-days .d:nth-child(4){animation-delay:0.94s}
.roster-days .d:nth-child(5){animation-delay:1.0s}
.roster-days .d:nth-child(6){animation-delay:1.06s}
.roster-days .d:nth-child(7){animation-delay:1.12s}
.roster-days .d:nth-child(8){animation-delay:1.18s}
.roster-days .d.weekend{color:#C9922E}

.roster-row{display:grid;grid-template-columns:42px repeat(7,1fr);gap:3px;margin-bottom:3px}
.shift-label{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;color:#7A8490;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;letter-spacing:1px;opacity:0;transform:translateX(-8px);animation:fadeRight 0.3s ease forwards}
.roster-row:nth-child(2) .shift-label{animation-delay:1.1s}
.roster-row:nth-child(3) .shift-label{animation-delay:1.18s}
.roster-row:nth-child(4) .shift-label{animation-delay:1.26s}
.roster-row:nth-child(5) .shift-label{animation-delay:1.34s}

/* Cell base state */
.cell{aspect-ratio:1;background:rgba(255,255,255,0.02);border:1px solid rgba(201,146,46,0.15);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:8px;color:#FAF6EE;position:relative;overflow:hidden;opacity:0;transform:scale(0.7)}

/* Cell filled — amber */
.cell.fill{background:rgba(201,146,46,0.85);color:#0A0A0A;border-color:rgba(201,146,46,0.95)}
.cell.check::after{content:'✓';font-size:11px;font-weight:800}
.cell.initials::after{content:attr(data-n);font-size:8px}

/* Every cell animates in. Unique delays for organic feel. */
.c-1{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.4s forwards}
.c-2{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.3s forwards}
.c-3{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.7s forwards}
.c-4{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.1s forwards}
.c-5{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.1s forwards}
.c-6{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.8s forwards}
.c-7{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.7s forwards}
.c-8{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.55s forwards}
.c-9{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.3s forwards}
.c-10{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.5s forwards}
.c-11{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 4.0s forwards}
.c-12{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.85s forwards}
.c-13{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.5s forwards}
.c-14{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.9s forwards}
.c-15{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.4s forwards}
.c-16{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.0s forwards}
.c-17{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.65s forwards}
.c-18{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 4.3s forwards}
.c-19{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.2s forwards}
.c-20{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.4s forwards}
.c-21{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.95s forwards}
.c-22{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.65s forwards}
.c-23{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.6s forwards}
.c-24{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 4.1s forwards}
.c-25{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 1.45s forwards}
.c-26{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 2.8s forwards}
.c-27{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 4.4s forwards}
.c-28{animation:cellIn 0.35s cubic-bezier(.16,1,.3,1) 3.2s forwards}

/* Bottom callout after grid completes */
.s1-foot{position:absolute;top:430px;left:0;right:0;text-align:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:0.5px;color:#C9922E;text-transform:uppercase;opacity:0;animation:fadeUp 0.4s ease 4.8s forwards}
.s1-foot small{display:block;margin-top:6px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;letter-spacing:2.5px;color:#7A8490;text-transform:uppercase}

/* ───────────── SCENE 2: CTA ───────────── */
.s2-eyebrow{position:absolute;top:152px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:3px;color:#C9922E;text-transform:uppercase;opacity:0;animation:fadeIn 0.35s ease 5.9s forwards}

.s2-hero{position:absolute;top:188px;left:0;right:0;text-align:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:900;font-size:60px;line-height:0.92;letter-spacing:-1px;text-transform:uppercase}
.s2-hero span{display:block;opacity:0;transform:translateY(22px)}
.s2-hero .k1{animation:springUp 0.5s cubic-bezier(.16,1,.3,1) 6.1s forwards}
.s2-hero .k2{color:#C9922E;animation:springUp 0.5s cubic-bezier(.16,1,.3,1) 6.4s forwards}

.s2-rule{position:absolute;top:314px;left:50%;transform:translateX(-50%);width:0;height:3px;background:#C9922E;animation:drawRule 0.45s cubic-bezier(.16,1,.3,1) 6.9s forwards}

.s2-sub{position:absolute;top:336px;left:0;right:0;text-align:center;font-family:'Barlow',sans-serif;font-weight:600;font-size:12.5px;color:#A0A0A0;opacity:0;animation:fadeUp 0.4s ease 7.25s forwards;letter-spacing:0.3px;line-height:1.55;padding:0 18px}

.creds{position:absolute;top:408px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9.5px;letter-spacing:2.5px;color:#C9922E;text-transform:uppercase;opacity:0;animation:fadeUp 0.4s ease 7.85s forwards}

.url{position:absolute;top:448px;left:0;right:0;text-align:center;font-family:'Barlow',sans-serif;font-weight:700;font-size:12px;letter-spacing:2.5px;color:#FAF6EE;text-transform:uppercase;opacity:0;animation:fadeUp 0.4s ease 8.5s forwards}

/* Keyframes ─────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes springUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes drawRule{from{width:0}to{width:130px}}
@keyframes cellIn{0%{opacity:0;transform:scale(0.4)}50%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes slideOutLeft{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
</style>
</head>

<script>
(function(){
  const tm=document.getElementById('tm'),rb=document.getElementById('rb'),dz=document.getElementById('dz'),rf=document.getElementById('rf');
  dz.addEventListener('change',()=>rf.classList.toggle('dz-on',dz.checked));
  const TOTAL=10;let st=performance.now(),raf;
  function tick(n){const e=(n-st)/1000;tm.textContent=Math.min(e,TOTAL).toFixed(1)+'s';if(e<TOTAL)raf=requestAnimationFrame(tick);}
  function replay(){cancelAnimationFrame(raf);const rfEl=document.getElementById('rf');const c=rfEl.cloneNode(true);rfEl.parentNode.replaceChild(c,rfEl);st=performance.now();raf=requestAnimationFrame(tick);}
  rb.addEventListener('click',replay);raf=requestAnimationFrame(tick);setInterval(replay,TOTAL*1000);
})();
</script>
